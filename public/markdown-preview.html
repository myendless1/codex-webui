<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#ffffff">
    <title>Markdown 预览</title>
    <link rel="icon" href="/app-icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/markdown-preview.css">
  </head>
  <body>
    <header class="markdown-preview-header">
      <div>
        <strong data-preview-name>Markdown 预览</strong>
        <span data-preview-path></span>
      </div>
      <a data-raw-link target="_blank" rel="noopener noreferrer">查看原文</a>
    </header>
    <main class="markdown-preview-shell">
      <article class="markdown-body" data-markdown-content aria-live="polite">正在载入…</article>
    </main>
    <script src="/markdown-preview.js" type="module"></script>
  </body>
</html>
