<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Codex WebUI">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#ffffff">
    <script>
      try {
        if (localStorage.getItem("codex-webui:theme") === "dark") {
          document.documentElement.classList.add("theme-dark");
          document.querySelector('meta[name="theme-color"]').content = "#181817";
        }
        const fontSizeOffset = Number.parseInt(localStorage.getItem("codex-webui:font-size-offset") || "0", 10);
        document.documentElement.style.setProperty("--font-size-offset", `${Math.min(5, Math.max(-3, fontSizeOffset || 0))}px`);
      } catch {}
    </script>
    <title>Codex WebUI</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/app-icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/app-icon-180.png">
    <link rel="stylesheet" href="/vendor/@xterm/xterm/css/xterm.css">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="app-shell" data-app-shell>
      <aside class="side-rail" aria-label="主导航">
        <div class="brand-block">
          <div class="brand-copy">
            <h1>Codex</h1>
          </div>
        </div>
        <nav class="nav-stack" data-nav></nav>
        <div class="sidebar-sessions" data-sidebar-sessions></div>
        <div class="rail-footer" aria-live="polite">
          <strong data-codex-version>checking</strong>
          <span data-codex-health>local adapter</span>
        </div>
        <nav class="nav-stack nav-bottom" data-bottom-nav></nav>
      </aside>

      <div class="workspace">
        <header class="topbar">
          <button class="button icon ghost mobile-menu-toggle" type="button" data-action="toggle-session-drawer" aria-label="打开会话列表" title="会话列表">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
          <div class="topbar-title">
            <h2 data-active-title>Codex 会话</h2>
            <p class="eyebrow" data-active-kicker>Workspace</p>
          </div>
          <div class="topbar-actions">
            <button class="button icon ghost topbar-popout-toggle" type="button" data-action="open-session-popout" data-keep-enabled="true" aria-label="弹出当前会话" title="弹出当前会话" hidden></button>
            <button class="button icon ghost topbar-note-toggle" type="button" data-action="toggle-workspace-note" data-keep-enabled="true" aria-label="打开工作区笔记" title="工作区笔记"></button>
            <button class="button icon ghost topbar-browser-fullscreen" type="button" data-action="toggle-browser-fullscreen" aria-label="进入浏览器全屏" title="进入浏览器全屏"></button>
            <button class="button icon ghost topbar-terminal-toggle" type="button" data-action="toggle-terminal" aria-label="打开终端" title="打开终端" hidden></button>
            <button class="button icon ghost topbar-new-session" type="button" data-action="open-new-session-sheet" aria-label="新建对话" title="新建对话">+</button>
          </div>
          <canvas id="signalCanvas" class="signal-canvas" width="420" height="72" aria-hidden="true"></canvas>
        </header>

        <main class="content">
          <section class="view active" data-view="console" aria-label="Codex 会话"></section>
          <section class="view" data-view="settings" aria-label="设置"></section>
        </main>
      </div>
    </div>

    <div class="session-drawer-backdrop" data-session-drawer-backdrop hidden></div>
    <aside class="session-drawer" data-session-drawer aria-label="会话列表" aria-hidden="true"></aside>
    <div class="session-filter-layer" data-session-filter-layer hidden></div>
    <div class="archived-session-layer" data-archived-session-layer hidden></div>
    <div class="sheet-backdrop" data-new-session-sheet hidden></div>
    <nav class="mobile-nav" data-mobile-nav aria-label="移动端导航"></nav>
    <div class="approval-dialog-layer" data-approval-dialog hidden></div>
    <div class="image-preview-layer" data-image-preview-layer hidden></div>
    <div class="video-preview-layer" data-video-preview-layer hidden></div>
    <div class="markdown-preview-layer" data-markdown-preview-layer hidden></div>
    <aside class="workspace-note" data-workspace-note aria-label="工作区共享笔记" aria-hidden="true" hidden>
      <header class="workspace-note-header" data-workspace-note-drag-handle>
        <div class="workspace-note-title">
          <span class="workspace-note-mark" aria-hidden="true"></span>
          <strong>工作区笔记</strong>
          <span class="workspace-note-status" data-workspace-note-status role="status" aria-live="polite">正在连接…</span>
        </div>
        <div class="workspace-note-actions">
          <button type="button" data-action="toggle-workspace-note-fullscreen" data-keep-enabled="true" aria-label="全屏显示笔记" title="全屏显示笔记"></button>
          <button type="button" data-action="close-workspace-note" data-keep-enabled="true" aria-label="关闭笔记" title="关闭笔记">×</button>
        </div>
      </header>
      <textarea class="workspace-note-editor" data-workspace-note-editor data-keep-enabled="true" maxlength="524288" placeholder="记录想法…内容会自动保存，并在此工作区的设备间同步。" aria-label="工作区共享笔记内容"></textarea>
      <footer class="workspace-note-footer">
        <span data-workspace-note-scope>自动保存 · 工作区共享</span>
        <span data-workspace-note-count>0 字</span>
      </footer>
    </aside>
    <div class="toast-zone" data-toasts aria-live="polite"></div>
    <script src="/app.js" type="module"></script>
  </body>
</html>
